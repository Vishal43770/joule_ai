description: Create a purchase order based on a purchase requisition ID.

slots:
  - name: pr_id
    description: ID of the purchase requisition the new purchase order is based on.
    sources:
      - type: scenario
        name: purchase/get_pr
        key: $target_result.id

target:
  type: function
  name: purchase/create_po

response_context:
  - value: $target_result.po_id
    description: Created Purchase Order ID
