description: Restricted scenario accessible only to Finance Admin group or specific IAS User UUID.
target:
  type: function
  name: role_access_function

visibility_condition:
  objects:
    - type: ias_attributes
      attributes:
        - attribute: groups
          match: "ANY"
          values:
            - Finance_Admin
            - Currency_Managers
        - attribute: user_uuid
          match: "ANY"
          values:
            - "e6b7d5d3-f7bb-4e82-8205-81600782307a"

response_context:
  - value: role_access_function
    description: Role access response details
