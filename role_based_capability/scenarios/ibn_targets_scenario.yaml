description: Restricted scenario accessible to users with specific Intent-Based Navigation (IBN) targets.
target:
  type: function
  name: role_access_function

visibility_condition:
  objects:
    - type: ibn_targets
      match: "ALL"
      intents:
        - semantic_object: CurrencyManagement
          action: display
        - semantic_object: InvoiceProcessing
          action: approve

response_context:
  - value: role_access_function
    description: IBN target access response details
