action_groups:
  - actions:
      - type: set-variables
        variables:
          - name: user_email
            value: "<? $transient.user.email ?>"
          - name: user_uuid
            value: "<? $transient.user.uuid ?>"
result:
  status: "Access Granted"
  user_email: "<? user_email ?>"
  user_uuid: "<? user_uuid ?>"
