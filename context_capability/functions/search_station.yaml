parameters:
  - name: date
    optional: true
  - name: from_station_id
    optional: true
  - name: to_station_id
    optional: true

action_groups:
  - actions:
      - type: set-variables
        variables:
          - name: from_val
            value: "<? from_station_id ?: 'STN-101 (Central)' ?>"
          - name: to_val
            value: "<? to_station_id ?: 'Wiesloch-Walldorf' ?>"
          - name: date_val
            value: "<? date ?: '2026-08-15' ?>"
          - name: computed_id
            value: "STN-9999"
          - name: computed_capacity
            value: "1500 Passengers/hr"

      - type: message
        message:
          type: card
          content:
            title: "Train Station Search Results"
            subtitle: "Route: <? from_val ?> ➔ <? to_val ?>"
            description:
              value: "Travel Date: **<? date_val ?>**\nStation ID: **<? computed_id ?>**\nCapacity: **<? computed_capacity ?>**"
              markdown: true
            status: "Found"
            statusState: "success"

result:
  id: "<? computed_id ?>"
  capacity: "<? computed_capacity ?>"
  from_station: "<? from_val ?>"
  to_station: "<? to_val ?>"
