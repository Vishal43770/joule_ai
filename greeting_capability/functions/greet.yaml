parameters:
  - name: client_name
    optional: true
  - name: greeting_message
    optional: true

action_groups:
  - actions:
      - type: set-variables
        variables:
          - name: name_val
            value: "<? client_name ?: ($transient.user.first_name ?: 'Phani Kumar') ?>"
          - name: msg_val
            value: "<? greeting_message ?: 'Welcome to My AI Assistant!' ?>"

      - type: message
        message:
          type: card
          content:
            title: "Welcome to My AI Assistant!"
            subtitle: "Enterprise Joule Agent"
            description:
              value: "Hello **<? name_val ?>**! This is my custom message text. How can I help you today? WE CAN WRITE WHAT EVERY WE CAN IN GREETING!"
              markdown: true
            status: "Connected"
            statusState: "success"

result:
  greeting: "<? msg_val ?> <? name_val ?>"
