# ==============================================================================
# INITIALIZE HOOK: Sets initial variables automatically at start of conversation
# File: hooks/initialize.yaml (Supported actions: set-variables, api-request)
# ==============================================================================

action_groups:
  - condition: "true"
    actions:
      - type: set-variables
        variables:
          - name: client_name
            value: "<? $transient.user.first_name ?: 'Alex' ?>"
          - name: greeting_message
            value: "Welcome to SAP Joule"

result:
  client_name: "<? client_name ?>"
  greeting_message: "<? greeting_message ?>"
