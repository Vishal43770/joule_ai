parameters:
  - name: topic
    optional: true
  - name: stream_format
    optional: true

action_groups:
  # Action Group 1: JSON Format Stream (Mocked with set-variables for offline testing)
  - condition: 'stream_format == null || stream_format == "json"'
    actions:
      - type: status-update
        message: "Simulating live AI response stream..."

      - type: set-variables
        variables:
          - name: topic_val
            value: "<? topic ?: 'Quantum Computing' ?>"
          - name: mock_stream_response
            value: "Quantum computing leverages superposition and entanglement to perform complex computations exponentially faster than classical computers."

      - type: message
        message:
          type: card
          content:
            title: "Streamed AI Response: <? topic_val ?>"
            subtitle: "Mode: SSE Stream Simulation"
            description:
              value: "<? mock_stream_response ?>"
              markdown: true
            status: "Streaming Complete"
            statusState: "success"

  # Action Group 2: Plain Text Format Stream (Mocked with set-variables)
  - condition: 'stream_format == "text"'
    actions:
      - type: status-update
        message: "Streaming text data chunks..."

      - type: set-variables
        variables:
          - name: topic_val
            value: "<? topic ?: 'Artificial Intelligence' ?>"
          - name: mock_stream_response
            value: "Artificial Intelligence (AI) simulates human intelligence processes through machine learning algorithms and neural networks."

      - type: message
        message:
          type: text
          content: "### 🛰️ Streamed Text Output for **<? topic_val ?>**\n\n<? mock_stream_response ?>"

result:
  aggregated_response: "<? mock_stream_response ?>"
  status: "Completed"
