parameters:
  - name: topic
    optional: true
  - name: stream_format
    optional: true
  - name: enable_file_upload
    optional: true

action_groups:
  # Action Group 1: File Upload Action (type: file-upload)
  - condition: 'enable_file_upload == "true"'
    actions:
      - type: file-upload
        scripting_type: "spel"
        content:
          message: "Please select and upload a document (PDF, DOCX, JPG, PNG, or TXT) to proceed."
          on_cancel:
            title: "Cancel File Upload?"
            message: "Are you sure you want to cancel the file upload?"
            button_labels:
              cancel: "yes"
              continue: "no"
        allowed_file_types:
          - pdf
          - docx
          - jpg
          - png
          - txt
        max_file_size: 10
        max_files_allowed: 3
        result_variable: uploaded_file_result

  # Action Group 2: JSON Format SSE Stream (response_chunk_ref: $.delta.content)
  - condition: 'stream_format == null || stream_format == "json"'
    actions:
      - type: set-variables
        variables:
          - name: topic_val
            value: "<? topic ?: 'General Query' ?>"

      - type: streamed-message
        method: POST
        system_alias: StreamingService
        path: "/api/v1/stream/json"
        headers:
          Accept: "text/event-stream"
          Connection: "keep-alive"
          Cache-Control: "no-cache"
        body: '{"query": "<? topic_val ?>"}'
        response_chunk_ref: $.delta.content
        result_variable: streamed_json_result

  # Action Group 3: Plain Text Format SSE Stream (response_chunk_ref: $)
  - condition: 'stream_format == "text"'
    actions:
      - type: set-variables
        variables:
          - name: topic_val
            value: "<? topic ?: 'General Query' ?>"

      - type: streamed-message
        method: GET
        system_alias: StreamingService
        path: "/api/v1/stream/text"
        headers:
          Accept: "text/event-stream"
          Connection: "keep-alive"
          Cache-Control: "no-cache"
        response_chunk_ref: $
        result_variable: streamed_text_result

result:
  aggregated_response: "<? streamed_json_result ?: streamed_text_result ?>"
  uploaded_files: "<? uploaded_file_result ?>"
  status: "Completed"
