description: This function fetches the weather for a given city and collects user rating.

slots:
  - name: city
    description: Weather information fetched for this city
  - name: weather_rating
    description: User rating score for the weather service (1 to 5)

target:
  type: function
  name: fetch_weather_info

response_context:
  - value: temperatureMax
    description: Maximum temperature for the requested city
  - value: city
    description: City for which the weather was requested
  - value: timestamp
    description: Time of the weather information
