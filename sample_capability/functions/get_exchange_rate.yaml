parameters:
  - name: currency_from
    optional: true
  - name: currency_to
    optional: true
  - name: amount
    optional: true

action_groups:
  - actions:
      - type: set-variables
        variables:
          - name: from_currency
            value: "<? currency_from != null ? currency_from.toUpperCase() : 'USD' ?>"
          - name: to_currency
            value: "<? currency_to != null ? currency_to.toUpperCase() : 'EUR' ?>"
      # Frankfurter v2 returns a flat JSON object with a top-level `rate` field.
      - type: api-request
        system_alias: FrankfurterAPI
        path: "/v2/rate/<? from_currency ?>/<? to_currency ?>"
        method: GET
        headers:
          Accept: application/json
        timeout: 15
        result_variable: api_result

  - condition: "api_result != null && api_result.status_code == 200 && api_result.body != null && api_result.body.rate != null"
    actions:
      - type: set-variables
        variables:
          - name: rate_value
            value: "<? api_result.body.rate ?>"

  - condition: "api_result != null && api_result.status_code == 200 && api_result.body != null && api_result.body.rate != null && amount != null"
    actions:
      - type: set-variables
        variables:
          # Slots are strings. Convert the supplied amount to a number first.
          - name: amount_value
            value: "<? T(java.lang.Double).parseDouble(amount) ?>"

  # Currency conversion rule: Converted Amount = Amount x Exchange Rate.
  # It uses the local values, not an API-provided converted amount.
  - condition: "amount_value != null && rate_value != null"
    actions:
      - type: set-variables
        variables:
          - name: converted_amount
            value: "<? amount_value * rate_value ?>"

  - condition: "amount != null && amount_value != null && rate_value != null && converted_amount != null"
    actions:
      - type: message
        message:
          type: text
          content: "<? 'Currency Conversion Successful\n- Amount: ' + amount + ' ' + from_currency + '\n- Converted Amount: ' + converted_amount + ' ' + to_currency + '\n- Exchange Rate: ' + rate_value + '\n- Provider: Frankfurter' ?>"

  - condition: "api_result != null && api_result.status_code == 200 && api_result.body != null && api_result.body.rate != null && amount == null"
    actions:
      - type: message
        message:
          type: text
          content: "<? 'Exchange Rate Retrieved Successfully\n- From: ' + from_currency + '\n- To: ' + to_currency + '\n- Rate: ' + rate_value + '\n- Provider: Frankfurter' ?>"

  - condition: "amount != null && (amount_value == null || rate_value == null || converted_amount == null)"
    actions:
      - type: message
        message:
          type: text
          content: "Unable to calculate the converted amount. Provide a numeric amount, for example: Convert 500 USD to EUR."

  - condition: "api_result == null || api_result.status_code != 200 || api_result.body == null || api_result.body.rate == null"
    actions:
      - type: message
        message:
          type: text
          content: "Unable to retrieve an exchange rate. Ensure the requested currencies use ISO codes, then try again."

result:
  exchange_rate: "<? api_result != null && api_result.status_code == 200 && api_result.body != null ? api_result.body.rate : null ?>"
  amount: "<? amount ?>"
  converted_amount: "<? converted_amount ?>"
  from_currency: "<? from_currency ?>"
  to_currency: "<? to_currency ?>"
  provider: "<? api_result != null && api_result.status_code == 200 && api_result.body != null ? 'Frankfurter' : null ?>"
